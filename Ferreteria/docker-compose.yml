services:

  config-server:
    build:
      context: ./config-server
    image: config-server:1.0
    container_name: config-server
    ports:
      - "8888:8888"
    restart: unless-stopped
    networks:
      - ferreteria-network

  eureka-server:
    build:
      context: ./eureka-server
    image: eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    restart: unless-stopped
    networks:
      - ferreteria-network

  gateway-server:
    build:
      context: ./gateway-server
    image: gateway-server:1.0
    container_name: gateway-server
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    restart: unless-stopped
    networks:
      - ferreteria-network

  ms-productos:
    build:
      context: ./ms-productos
    image: ms-productos:1.0
    container_name: ms-productos
    ports:
      - "8081:8081"
    depends_on:
      - gateway-server
    restart: unless-stopped
    networks:
      - ferreteria-network

  ms-inventario:
    build:
      context: ./ms-inventario
    image: ms-inventario:1.0
    container_name: ms-inventario
    ports:
      - "8082:8082"
    depends_on:
      - gateway-server
    restart: unless-stopped
    networks:
      - ferreteria-network

networks:
  ferreteria-network:
    driver: bridge